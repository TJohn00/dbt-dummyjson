version: 2

models:
  - name: stg_products
    columns:

      - name: product_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null
      - name: category
        tests:
          - not_null

  - name: stg_product_reviews
    columns:
      - name: product_id
        tests:
          - not_null
      - name: reviewer_email
        tests:
          - not_null

  - name: stg_categories
    columns:
      - name: slug
        tests:
          - not_null
      - name: name
        tests:
          - not_null
      - name: url
        tests:
          - not_null

  - name: stg_users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: first_name
        tests:
          - not_null
      - name: age
        tests:
          - not_null
      - name: gender
        tests:
          - not_null
      - name: email
        tests:
          - unique
          - not_null
      - name: phone
        tests:
          - unique
          - not_null
      - name: username
        tests:
          - unique
          - not_null
      - name: birth_date
        tests:
          - not_null
      - name: address_city
        tests:
          - not_null
      - name: address_state
        tests:
          - not_null
      - name: address_country
        tests:
          - not_null

  - name: stg_carts
    columns:
      - name: cart_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - unique
          - not_null

  - name: stg_cart_items
    columns:
      - name: cart_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null